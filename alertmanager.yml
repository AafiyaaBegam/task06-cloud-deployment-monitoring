global:
  resolve_timeout: 5m

route:
  receiver: webhook-placeholder
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: webhook-placeholder
    webhook_configs:
      # Replace with a real HTTPS incident endpoint before expecting notifications.
      # Never commit a secret-bearing URL.
      - url: "${ALERT_WEBHOOK_URL}"
        send_resolved: true
